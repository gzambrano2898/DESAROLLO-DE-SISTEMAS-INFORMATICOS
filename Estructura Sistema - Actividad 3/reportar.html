<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Incidente</title>
</head>
<body>
    <header>
        <h1>Sistema Help Desk</h1>
        <p>Registro de Incidentes</p>
    </header>
    <nav>
        <a href="index.html">Inicio</a> |
        <a href="reportar.html">Reportar Incidente</a> |
        <a href="tickets.html">Tickets Registrados</a>
    </nav>
    <main>
        <section>
            <h2>Formulario de Registro de Incidentes</h2>
            <article>
                <h3>Datos del Incidente</h3>
                <form action="#" method="post">
                    <p>
                        <label for="titulo">Título del incidente:</label>
                        <br>
                        <input type="text" id="titulo" name="titulo" required>
                    </p>
                    <p>
                        <label for="categoria">Categoría:</label>
                        <br>
                        <select id="categoria" name="categoria">
                            <option value="red">Red</option>
                            <option value="hardware">Hardware</option>
                            <option value="software">Software</option>
                        </select>
                    </p>
                    <fieldset>
                        <legend>Nivel de Prioridad</legend>
                        <input type="radio" id="alta" name="prioridad" value="alta">
                        <label for="alta">Alta</label>
                        <input type="radio" id="media" name="prioridad" value="media">
                        <label for="media">Media</label>
                        <input type="radio" id="baja" name="prioridad" value="baja">
                        <label for="baja">Baja</label>
                    </fieldset>
                    <p>
                        <label for="descripcion">
                            Descripción detallada del incidente:
                        </label>
                        <br>
                        <textarea
                            id="descripcion"
                            name="descripcion"
                            rows="6"
                            cols="50"
                            required></textarea>
                    </p>
                    <p>
                        <button type="submit">
                            Registrar Incidente
                        </button>
                    </p>
                </form>
            </article>
        </section>
    </main>
    <footer>
        <p>Universidad Técnica de Manabí</p>
        <p>Desarrollo de Sistemas Informáticos - 2026</p>
    </footer>
</body>
</html>
