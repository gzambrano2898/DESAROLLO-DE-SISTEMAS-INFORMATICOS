<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Incidente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Sistema Help Desk</h1>
        <p>Registro de Incidentes</p>
    </header>

    <nav class="navbar">
        <a href="index.html">Inicio</a>
        <a href="reportar.html">Reportar Incidente</a>
        <a href="tickets.html">Tickets Registrados</a>
    </nav>

    <main class="container">
        <section class="section">
            <h2>Formulario de Registro de Incidentes</h2>

            <article class="card">
                <h3>Datos del Incidente</h3>

                <form class="form" action="#" method="post">
                    <label for="titulo">Título del incidente:</label>
                    <input class="form-control" type="text" id="titulo" name="titulo" required>

                    <label for="categoria">Categoría:</label>
                    <select class="form-control" id="categoria" name="categoria">
                        <option value="red">Red</option>
                        <option value="hardware">Hardware</option>
                        <option value="software">Software</option>
                    </select>

                    <fieldset class="fieldset">
                        <legend>Nivel de Prioridad</legend>

                        <div class="radio-group">
                            <input type="radio" id="alta" name="prioridad" value="alta">
                            <label for="alta">Alta</label>

                            <input type="radio" id="media" name="prioridad" value="media">
                            <label for="media">Media</label>

                            <input type="radio" id="baja" name="prioridad" value="baja">
                            <label for="baja">Baja</label>
                        </div>
                    </fieldset>

                    <label for="descripcion">Descripción detallada del incidente:</label>
                    <textarea class="form-control" id="descripcion" name="descripcion" rows="6" required></textarea>

                    <button class="btn btn-primary" type="submit">
                        Registrar Incidente
                    </button>
                </form>
            </article>
        </section>
    </main>

    <footer class="footer">
        <p>Universidad Técnica de Manabí</p>
        <p>Desarrollo de Sistemas Informáticos - 2026</p>
    </footer>
</body>
</html>
