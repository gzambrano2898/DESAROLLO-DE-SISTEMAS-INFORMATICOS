<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design System - Help Desk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>Design System - Help Desk</h1>
    <p>Librería de componentes UI reutilizables</p>
  </header>

  <main class="container">

    <section class="section">
      <h2>Botones</h2>
      <button class="btn btn-primary">Primario</button>
      <button class="btn btn-secondary">Secundario</button>
      <button class="btn btn-danger">Peligro</button>
    </section>

    <section class="section">
      <h2>Formularios</h2>
      <input class="form-control" type="text" placeholder="Ingrese el asunto del ticket">

      <select class="form-control">
        <option>Seleccionar prioridad</option>
        <option>Alta</option>
        <option>Media</option>
        <option>Baja</option>
      </select>
    </section>

    <section class="section">
      <h2>Tarjeta de Ticket</h2>
      <div class="card">
        <h3>Error al iniciar sesión</h3>
        <p>El usuario no puede acceder al sistema con sus credenciales.</p>
        <span class="badge badge-high">Alta</span>
      </div>
    </section>

    <section class="section">
      <h2>Badges de Prioridad</h2>
      <span class="badge badge-high">Alta</span>
      <span class="badge badge-medium">Media</span>
      <span class="badge badge-low">Baja</span>
    </section>

  </main>

</body>
</html>
